<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basecamp User Highlighter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10201a;
      --card: #1b3028;
      --text: #eef5ef;
      --muted: #9db5a8;
      --accent: #2fb573;
      --track: #35503f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
    header img { width: 24px; height: 24px; border-radius: 5px; }
    h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
    main { padding: 0 12px 12px; display: grid; gap: 8px; }
    .card { padding: 12px; background: var(--card); border-radius: 6px; }
    h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    .hint { color: var(--muted); font-size: 12px; }
    .switch { position: relative; flex: none; width: 34px; height: 20px; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--track); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .person { display: flex; align-items: center; gap: 8px; min-height: 30px; }
    .person.off .name, .person.off .count { opacity: .5; }
    .dot { flex: none; width: 26px; height: 26px; padding: 0; border: 3px solid; border-radius: 50%; overflow: hidden; }
    .dot .avatar { display: block; width: 100%; height: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
    .chip { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 8px 3px 3px; border: 1px solid var(--track); border-radius: 14px; background: none; }
    .chip:hover { border-color: var(--accent); background: var(--track); }
    .chip.away { opacity: .65; }
    .chip > span:not(.count) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search { width: 100%; margin-bottom: 8px; padding: 4px 8px; border: 1px solid var(--track); border-radius: 4px; background: var(--bg); color: inherit; font: inherit; }
    .avatar { flex: none; width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .name { flex: 1; min-width: 0; padding: 3px 5px; border: 1px solid transparent; border-radius: 4px; background: none; color: inherit; font: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input.name:hover, input.name:focus { border-color: var(--track); background: var(--bg); outline: none; }
    .count { flex: none; min-width: 20px; padding: 0 5px; border-radius: 9px; background: var(--track); font-size: 11px; line-height: 18px; text-align: center; }
    .icon { flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--muted); font-size: 16px; line-height: 1; }
    .icon:hover { background: var(--track); color: var(--text); }
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px 0 8px 26px; }
    .swatches button { aspect-ratio: 1; padding: 0; border: 2px solid transparent; border-radius: 50%; }
    .swatches button.current, .swatches button:hover { border-color: #fff; }
    .picker { display: grid; gap: 8px; padding: 6px 0 2px 26px; }
    .picker-area { position: relative; height: 90px; border-radius: 6px; background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent); cursor: crosshair; touch-action: none; }
    .picker-handle { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px #000; pointer-events: none; }
    .picker-hue { width: 100%; height: 10px; margin: 0; border-radius: 5px; appearance: none; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); cursor: pointer; }
    .picker-hue::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; background: transparent; box-shadow: 0 0 2px #000; }
    .picker-hue::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: transparent; box-shadow: 0 0 2px #000; }
    .picker-hex { width: 90px; padding: 3px 6px; border: 1px solid var(--track); border-radius: 4px; background: var(--bg); color: inherit; font: 12px ui-monospace, monospace; }
    .option { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; font-size: 12px; cursor: pointer; }
    .option input { margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
    .slider { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
    .action { width: 100%; margin-top: 8px; padding: 6px; border: 0; border-radius: 4px; background: var(--accent); color: #10201a; font-weight: 600; }
    footer { padding: 0 16px 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <h1>Basecamp User Highlighter</h1>
    <label class="switch" title="Turn highlighting on or off"><input id="enabled" type="checkbox" aria-label="Highlighting"><span></span></label>
  </header>
  <main>
    <section class="card" id="access" hidden>
      <div class="hint">The extension needs your permission to run on Basecamp.</div>
      <button class="action" id="grant" type="button">Allow on Basecamp</button>
    </section>
    <section class="card">
      <h2>Highlighted people</h2>
      <div id="persons"></div>
    </section>
    <section class="card">
      <h2>Quick add</h2>
      <input id="search" type="search" placeholder="Search for someone" aria-label="Search for someone" hidden>
      <div id="page"></div>
    </section>
    <section class="card">
      <div class="slider">
        <label for="opacity">Intensity</label>
        <input id="opacity" type="range" min="0.05" max="0.8" step="0.01">
      </div>
      <label class="option"><input id="dimOthers" type="checkbox"><span>Dim everyone else's tasks</span></label>
      <label class="option"><input id="borderOnly" type="checkbox"><span>Border only, no color behind the text</span></label>
    </section>
  </main>
  <footer>Tip: right-click an avatar in Basecamp to add or remove someone.</footer>
  <script src="src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
